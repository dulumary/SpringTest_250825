<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>판매자 추가</title>

</head>
<body>

        <h3>판매자 추가</h3>

        <form method="post" action="/mvc/seller/add">

            <input type="text" class="form-control col-3" name="nickname">
            <label>프로필 사진</label>
            <input type="text" class="form-control col-7" name="profileImage">
            <label>매너온도</label>
            <input type="text" class="form-control col-3" name="temperature">

        </form>

    </div>



</body>
</html>
